name: Retrain ML model

on:
  schedule:
    # Weekly on Mondays 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-training pipeline
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python -m training.pipeline

      - name: Auto-commit promoted model + metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Needs a repo-scoped PAT (GH_PAT): the default GITHUB_TOKEN cannot
          # push to the default branch or re-trigger workflows.
          token: ${{ secrets.GH_PAT }}
          commit_message: "chore(ml): promote retrained model"
          file_pattern: "ml-service/models/phishing_xgboost.joblib ml-service/models/metrics.json"