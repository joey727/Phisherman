name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check production build
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Build Docker image
        run: docker build -t phisherman:${{ github.sha }} .

  ml-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test app and model
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.model import is_model_loaded

          client = TestClient(app)
          with client:
              health = client.get("/health")
              assert health.status_code == 200, health.text
              assert health.json()["model_loaded"] is True, "committed model failed to load"

              resp = client.post("/predict", json={"url": "https://login-secure-verify.example.com/update/account", "meta": {}})
              assert resp.status_code == 200, resp.text
              body = resp.json()
              assert "score" in body and "label" in body and "top_features" in body, body

          print("ml-service smoke test passed")
          EOF

      - name: Build ML Docker image
        run: docker build -t ml-service:${{ github.sha }} .
